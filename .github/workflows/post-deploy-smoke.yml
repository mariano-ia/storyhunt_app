name: Post-deploy smoke

# Runs every time main is updated. Vercel auto-deploys main; we wait long
# enough for that to finish, then hit the deployed surfaces and assert.
# Exit code = number of failed checks (0 = clean).
#
# Required repo secret:
#   CRON_SECRET — used to call /api/debug/reconcile against prod.
#
# Optional repo variables (set in Settings → Actions → Variables):
#   ABM_URL  — default https://storyhunt-app.vercel.app
#   WEB_URL  — default https://storyhunt.city
#
# Output: GitHub Actions tab shows the smoke run; on failure a workflow status
# badge in the README + email to the repo owner (default GH behavior).

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Lets you re-run the smoke manually from the Actions tab without pushing.

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel deploy
        # Poll the Bokun webhook endpoint as canary — returns 401 once the
        # current build is live. Previous deploys without /api/bokun would
        # 404, so this signals "the NEW code is serving traffic" (vs. a
        # dumb sleep that might fire before the deploy propagates). Cap at
        # 5 minutes so we don't hang on stuck deploys.
        env:
          ABM_URL: ${{ vars.ABM_URL || 'https://storyhunt-app.vercel.app' }}
        run: |
          DEADLINE=$(($(date +%s) + 300))
          until [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$ABM_URL/api/bokun/webhook" -H 'Content-Type: application/json' -d '{}')" = "401" ]; do
            if [ $(date +%s) -gt $DEADLINE ]; then
              echo "::warning::Deploy not confirmed after 5 min, running smoke anyway"
              break
            fi
            sleep 10
          done
          echo "Deploy ready"

      - name: Run smoke
        env:
          ABM_URL: ${{ vars.ABM_URL || 'https://storyhunt-app.vercel.app' }}
          WEB_URL: ${{ vars.WEB_URL || 'https://storyhunt.city' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/post-deploy-smoke.sh
